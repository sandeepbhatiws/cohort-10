<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Listing</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(to bottom, #f8fafc, #eef2ff);
        }

        .float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }
    </style>

</head>

<body class="font-sans">

    <!-- Hero -->
    <section
        class="relative overflow-hidden bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white py-20">

        <div class="absolute w-80 h-80 bg-white/10 rounded-full blur-3xl -top-20 -left-20"></div>
        <div class="absolute w-96 h-96 bg-pink-300/20 rounded-full blur-3xl bottom-0 right-0"></div>

        <div class="max-w-7xl mx-auto px-6 text-center relative z-10">

            <h1 class="text-5xl md:text-6xl font-extrabold mb-5 animate-pulse">
                Discover Amazing Products
            </h1>

            <p class="text-lg text-indigo-100 max-w-2xl mx-auto">
                Premium collection with elegant design, fast delivery and unbeatable prices.
            </p>

            <button
                class="mt-8 bg-white text-indigo-700 px-8 py-3 rounded-full font-semibold hover:scale-110 transition duration-300 shadow-2xl">
                Shop Now
            </button>

        </div>

    </section>

    <!-- Filter -->
    <section class="max-w-7xl mx-auto px-6 py-10">

        <div class="flex flex-wrap justify-between items-center gap-5">

            <h2 class="text-3xl font-bold text-gray-800">
                Featured Products
            </h2>

            <div class="flex gap-3 flex-wrap">

                <button class="px-5 py-2 rounded-full bg-indigo-600 text-white shadow hover:scale-105 transition">
                    All
                </button>

                <button class="px-5 py-2 rounded-full bg-white shadow hover:bg-indigo-50 transition">
                    Shoes
                </button>

                <button class="px-5 py-2 rounded-full bg-white shadow hover:bg-indigo-50 transition">
                    Watches
                </button>

                <button class="px-5 py-2 rounded-full bg-white shadow hover:bg-indigo-50 transition">
                    Electronics
                </button>

            </div>

        </div>

    </section>

    <!-- Products -->
    <section class="max-w-7xl mx-auto px-6 pb-20">

        <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" id="movies"></div>

    </section>

    <script src="js/custom.js"></script>

</body>

</html>
